# Compila l'APK da condividere.
#
# Prima della build passa dal cancello: test di :core, coerenza dei documenti
# e catalogo rigenerato identico a quello committato (gli artefatti di
# strumenti/regole.py non si modificano a mano).
#
# L'APK e' di debug: firmato con la chiave di debug, si installa su qualsiasi
# telefono con "origini sconosciute" abilitate. Una release firmata richiede
# un keystore, che non sta nel repository.
name: APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag della release da creare (es. v1.0); vuoto = solo artefatto"
        required: false
        default: ""
  push:
    branches: ["**"]
    tags: ["v*"]

permissions:
  contents: write   # solo per creare la release e allegarvi l'APK

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test di :core
        run: ./gradlew :core:test

      - name: Coerenza
        run: python3 strumenti/coerenza.py

      - name: Catalogo allineato alla sorgente
        run: |
          python3 strumenti/regole.py
          git diff --exit-code -- app/src/main/assets/regole.json core/src/test

      - name: Compila l'APK di debug
        run: ./gradlew :app:assembleDebug

      - name: Rinomina
        run: cp app/build/outputs/apk/debug/app-debug.apk "LaRegolaDelGiorno-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LaRegolaDelGiorno-apk
          path: LaRegolaDelGiorno-*.apk

      # Due strade per la release: un tag v* pubblicato a mano, oppure
      # l'avvio manuale con l'input "tag", che crea tag e release sul commit
      # appena verificato dal cancello.
      - name: Allega alla release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: La Regola del Giorno ${{ inputs.tag || github.ref_name }}
          files: LaRegolaDelGiorno-*.apk
