# Versioni verificate a settembre 2026.
# AGP 9.x porta il supporto Kotlin INTEGRATO (vedi app/build.gradle.kts) e
# richiede JDK 17. La 9.4.1 continua a incorporare Kotlin 2.2.10, come la 9.0:
# salire di AGP non obbliga a muovere ne' il plugin Compose ne' KSP.
[versions]
agp = "9.4.1"
kotlin = "2.2.10"          # versione che AGP 9.0 usa internamente
ksp = "2.2.10-2.0.2"       # DA VERIFICARE: il suffisso KSP cambia a ogni patch di Kotlin
composeBom = "2026.09.00"  # Compose 1.12.1: pretende AGP 9.1+ e compileSdk 37, entrambi soddisfatti
room = "2.7.2"
work = "2.10.1"
datastore = "1.1.7"
activity = "1.10.1"
lifecycle = "2.9.1"
coreKtx = "1.16.0"
desugar = "2.1.5"
junit = "5.11.4"
junitPlatform = "1.11.4"   # allineata a junit 5.11.4: da Gradle 9 il launcher va dichiarato

[libraries]
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-foundation = { group = "androidx.compose.foundation", name = "foundation" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }

androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activity" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }

work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
desugar-jdk-libs = { group = "com.android.tools", name = "desugar_jdk_libs", version.ref = "desugar" }

junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
