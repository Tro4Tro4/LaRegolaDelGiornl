org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP registra le sorgenti generate via kotlin.sourceSets, che il Kotlin
# integrato di AGP 9 vieta. E' la via d'uscita documentata da Google finche'
# KSP non usa android.sourceSets: senza, nemmeno :core:test riesce a
# configurarsi. Da togliere quando KSP sara' allineato.
android.disallowKotlinSourceSets=false
